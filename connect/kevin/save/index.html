<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Kevin Saenz to Contacts | SOLYNX</title>
    <meta name="description" content="Add Kevin Saenz from SOLYNX LLC to your contacts with one tap.">
    <meta name="robots" content="noindex">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0f1a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, #00e1ff18, transparent 60%);
            animation: glowMove 18s linear infinite;
            z-index: -1;
        }

        @keyframes glowMove {
            0%   { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card {
            background: linear-gradient(145deg, #0e1624, #1a2540);
            border: 1px solid #00e1ff33;
            border-radius: 20px;
            padding: 40px 32px 36px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 0 60px #00e1ff18, 0 0 120px #00e1ff0a;
        }

        .logo {
            width: 110px;
            margin-bottom: 24px;
            animation: solynxGlow 2.8s ease-in-out infinite alternate;
        }

        @keyframes solynxGlow {
            0%   { filter: drop-shadow(0 0 6px #00e1ff44) drop-shadow(0 0 12px #00e1ff44); }
            100% { filter: drop-shadow(0 0 16px #00e1ff) drop-shadow(0 0 34px #00e1ff); }
        }

        .name {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .org {
            font-size: 0.95rem;
            color: #00e1ff;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 28px;
            font-size: 0.9rem;
            opacity: 0.75;
        }

        .contact-info a {
            color: inherit;
            text-decoration: none;
        }

        .contact-info a:hover {
            color: #00e1ff;
        }

        .btn-add {
            display: block;
            width: 100%;
            padding: 16px;
            background: #00e1ff;
            color: #001018;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            margin-bottom: 12px;
        }

        .btn-add:hover {
            background: #39edff;
            transform: translateY(-2px);
        }

        .btn-back {
            display: inline-block;
            margin-top: 4px;
            color: rgba(255,255,255,0.45);
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .btn-back:hover {
            color: #00e1ff;
        }

        .hint {
            font-size: 0.75rem;
            opacity: 0.4;
            margin-top: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="card">
        <img src="/assets/images/solynx-logo-v2.png" class="logo" alt="SOLYNX">

        <div class="name">Kevin Saenz</div>
        <div class="org">SOLYNX LLC</div>

        <div class="contact-info">
            <span>📞 <a href="tel:+12098045969">+1 (209) 804-5969</a></span>
            <span>✉️ <a href="mailto:kevin@solynx.solutions">kevin@solynx.solutions</a></span>
        </div>

        <a id="add-btn" href="/connect/kevin.vcf" class="btn-add">
            Add Kevin to Contacts
        </a>

        <a href="/connect/kevin/" class="btn-back">← Back to Kevin's Page</a>

        <p class="hint">
            Your phone will prompt you to save the contact.<br>
            Tap the button above if nothing opens automatically.
        </p>
    </div>

    <script>
        // Attempt to trigger the VCF download/open automatically on page load.
        // The visible button remains as a guaranteed fallback.
        // Guard: only fire once, avoid any redirect loops.
        (function () {
            var triggered = sessionStorage.getItem('kevin_vcf_triggered');
            if (!triggered) {
                sessionStorage.setItem('kevin_vcf_triggered', '1');
                // Small delay so the page is fully painted before browser hands off to OS
                setTimeout(function () {
                    window.location.href = '/connect/kevin.vcf';
                }, 600);
            }
        })();
    </script>
</body>

</html>
